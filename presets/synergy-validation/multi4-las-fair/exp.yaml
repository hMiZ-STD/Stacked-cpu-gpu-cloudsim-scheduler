# Synergy's LAS+fair run, replayed (docs/validation-plan.md). jobs.csv and ref_jct.csv come from the same Synergy run.
name: multi4-las-fair
cluster:
  server_groups:
    - { name: synergy-v100, count: 16, gpus: 8, gpu_type: V100, cpus: 24, mem_gb: 500, storage_mbps: 500, net_gbps: 0 }
workload:
  csv: jobs.csv
  labeller: { name: from_trace }
models:
  profiles_dir: ../../profiles/synergy-v100/models
  scaling: linear
  throughput_mode: synergy_two_point
  locality_penalty: 1.0
candidates:
  - name: multi4-las-fair
    trigger:    { name: periodic, params: { round_s: 300 } }
    ordering:   { name: las }
    allocation: { name: gpu_proportional }
    placement:  { name: first_fit }
    lifecycle:  { name: round_based, params: { synergy_rounds: true } }
seeds: [42]
output_dir: ../../../out/synergy-validation/multi4-las-fair
