# Synergy's reference run, reproduced (validation step 0; docs/validation-plan.md).
# Synergy: runner.py defaults, FIFO, 9 jobs/hr, split (20, 70, 10), seed 42, single-GPU jobs,
# 16 servers x (8 V100, 24 cores, 500 GB, 500 storage). Reference: mean JCT 21.8766 h, p99 156.933 h
# (jobs 4000-4999; presets/reference/synergy_ref_fifo_tune_9jph.csv).
#
# jobs.csv is the job list of that Synergy run, extracted from its out.log:
#   tools/.venv/bin/python tools/extract_synergy_jobs.py <out.log> -o presets/synergy-replica/jobs.csv
# Compare: tools/.venv/bin/python tools/compare_runs.py out/synergy-replica/fifo-tune/seed-42/jobs.csv \
#            presets/reference/synergy_ref_fifo_tune_9jph.csv
name: synergy-replica
cluster:
  server_groups:
    - { name: synergy-v100, count: 16, gpus: 8, gpu_type: V100, cpus: 24, mem_gb: 500, storage_mbps: 500, net_gbps: 0 }
workload:
  csv: jobs.csv
  labeller: { name: from_trace }       # models as Synergy assigned them; class_split (20,70,10) gives the same labels
models:
  profiles_dir: ../profiles/synergy-v100/models
  scaling: linear                      # Synergy loads <model>_1 for every GPU count
  throughput_mode: synergy_two_point   # ideal speedup at the ideal demand, else 1
  locality_penalty: 1.0                # every profile Synergy uses has placement_penalty = 1
candidates:
  # Synergy "FIFO+tune": the reference run
  - name: fifo-tune
    trigger:    { name: periodic, params: { round_s: 300 } }
    ordering:   { name: fifo }
    allocation: { name: synergy_tune }
    placement:  { name: first_fit }                       # Synergy's SYNERGY_RANDOM (no "place" in the name)
    lifecycle:  { name: round_based, params: { synergy_rounds: true } }
  # Synergy "FIFO+fair": GPU-proportional baseline (paper Fig 9: about 81 h at 9 jobs/hr)
  - name: fifo-fair
    trigger:    { name: periodic, params: { round_s: 300 } }
    ordering:   { name: fifo }
    allocation: { name: gpu_proportional }
    placement:  { name: first_fit }
    lifecycle:  { name: round_based, params: { synergy_rounds: true } }
  # Synergy "FIFO": Synergy-Greedy
  - name: fifo-greedy
    trigger:    { name: periodic, params: { round_s: 300 } }
    ordering:   { name: fifo }
    allocation: { name: synergy_greedy }
    placement:  { name: first_fit }
    lifecycle:  { name: round_based, params: { synergy_rounds: true } }
seeds: [42]
output_dir: ../../out/synergy-replica
